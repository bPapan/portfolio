<!DOCTYPE html>
<html>
  <head>
    <script type="text/javascript">
      // Get the current pathname and search query
      var pathname = window.location.pathname;
      var search = window.location.search;

      // Check if the pathname already starts with /portfolio
      if (!pathname.startsWith('/portfolio')) {
        // If it doesn't, prepend /portfolio to the path
        var newPath = '/portfolio' + pathname + search;
        window.location.replace(newPath);
      }
    </script>
  </head>
  <body>
    <p>Redirecting...</p>
  </body>
</html>
