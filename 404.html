<!DOCTYPE html>
<html>
  <head>
    <script type="text/javascript">
      // Get the current pathname and search query
      var pathname = window.location.pathname;
      var search = window.location.search;

      // GitHub Pages serves content under /portfolio/ so we need to add that base to the path
      var newPath = '/portfolio' + pathname + search;

      // Redirect the user to the correct URL path
      window.location.replace(newPath);
    </script>
  </head>
  <body>
    <p>Redirecting...</p>
  </body>
</html>
